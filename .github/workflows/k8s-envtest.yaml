name: k8s envtest

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: ['main']

permissions: {}

concurrency:
  group: k8s-envtest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  envtest:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: k8s/go.mod
          cache-dependency-path: k8s/go.sum
      - name: Run envtest suite
        run: make test-envtest
